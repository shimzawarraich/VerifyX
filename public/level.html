<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify It! · System Map</title>
  <link rel="stylesheet" href="levels.css">
</head>
<body>

  <div class="game-backdrop">
    <div class="glow glow1"></div>
    <div class="glow glow2"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="levels-container">
    <h1 class="title">SYSTEM MAP</h1>
    <p class="subtitle">Navigate the corrupted network</p>

    <div class="map-layout">
      <div class="map-wrap">
        <svg class="map-path" viewBox="0 0 700 340" preserveAspectRatio="xMidYMid meet">
          <path id="track" d="M 80 260 C 80 100, 210 100, 210 100 S 350 100, 350 220 S 470 320, 530 220 S 630 100, 650 160"
                fill="none" stroke="rgba(212,117,69,0.18)" stroke-width="2" stroke-dasharray="6 5"/>
          <path id="track-active" d="M 80 260 C 80 100, 210 100, 210 100"
                fill="none" stroke="rgba(212,117,69,0.55)" stroke-width="2.5"/>
        </svg>

        <div class="node-wrap" id="node-wrap"></div>
      </div>

      <aside class="sector-preview" id="sector-preview" aria-live="polite">
        <div class="preview-header">
          <span class="preview-kicker" id="preview-kicker">CURRENT SECTOR</span>
          <h2 id="preview-title">Sector 1 · Signal Docks</h2>
          <p id="preview-text">Recover the first truth fragments inside a flooded relay district where broken headlines still pulse through abandoned data canals.</p>
        </div>

        <div class="preview-map-shell">
          <div class="preview-map" id="preview-map"></div>
        </div>

        <div class="preview-meta">
          <span class="meta-pill" id="preview-difficulty">Threat: Low</span>
          <span class="meta-pill" id="preview-objective">Objective: Restore relays</span>
        </div>
      </aside>
    </div>
  </div>

  <script src="levels.js"></script>
</body>
</html>
