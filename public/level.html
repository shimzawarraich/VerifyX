<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VerifyX · System Map</title>
  <link rel="stylesheet" href="levels.css">
</head>
<body>

  <div class="game-backdrop">
    <div class="glow glow1"></div>
    <div class="glow glow2"></div>
  </div>

  <div class="levels-container">
    <h1 class="title">SYSTEM MAP</h1>
    <p class="subtitle">Navigate the corrupted network</p>

    <!-- SVG path connecting the nodes -->
    <div class="map-wrap">
      <svg class="map-path" viewBox="0 0 700 340" preserveAspectRatio="xMidYMid meet">
        <path id="track" d="M 80 260 C 80 100, 210 100, 210 100 S 350 100, 350 220 S 470 320, 530 220 S 630 100, 650 160"
              fill="none" stroke="rgba(212,117,69,0.18)" stroke-width="2" stroke-dasharray="6 5"/>
        <path id="track-active" d="M 80 260 C 80 100, 210 100, 210 100"
              fill="none" stroke="rgba(212,117,69,0.55)" stroke-width="2"/>
      </svg>

      <div class="node-wrap">

        <div class="map-node" style="left: 80px; top: 260px;">
          <div class="node unlocked current" data-level="1">
            <span class="node-num">1</span>
          </div>
          <span class="node-label">SECTOR 1</span>
        </div>

        <div class="map-node" style="left: 210px; top: 100px;">
          <div class="node locked" data-level="2">
            <span class="node-num">2</span>
          </div>
          <span class="node-label">SECTOR 2</span>
        </div>

        <div class="map-node" style="left: 350px; top: 220px;">
          <div class="node locked" data-level="3">
            <span class="node-num">3</span>
          </div>
          <span class="node-label">SECTOR 3</span>
        </div>

        <div class="map-node" style="left: 530px; top: 220px;">
          <div class="node locked" data-level="4">
            <span class="node-num">4</span>
          </div>
          <span class="node-label">SECTOR 4</span>
        </div>

        <div class="map-node" style="left: 650px; top: 160px;">
          <div class="node locked" data-level="5">
            <span class="node-num">5</span>
            <span class="node-crown">⍟</span>
          </div>
          <span class="node-label">CORE</span>
        </div>

      </div>
    </div>

  </div>

  <script src="levels.js"></script>
</body>
</html>
